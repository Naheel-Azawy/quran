<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
        <link rel="manifest" href="manifest.webmanifest">
        <link rel="icon" href="res/icon.png">
        <link rel="stylesheet" href="style.css">
        <meta name="description" content="The holy Quran">
        <meta name="keywords" content="quran islam">
        <meta name="author" content="Naheel">
        <title data-i18n="app.title">القرآن الكريم</title>
    </head>
    <body>
        <main class="pager-wrap">
            <button id="btn-prev" class="nav-btn nav-prev" aria-label="الصفحة السابقة" title="الصفحة السابقة" data-icon="chevron-back" data-i18n-aria-label="nav.prevPage" data-i18n-title="nav.prevPage"></button>

            <div id="output"></div>

            <button id="btn-next" class="nav-btn nav-next" aria-label="الصفحة التالية" title="الصفحة التالية" data-icon="chevron-back" data-i18n-aria-label="nav.nextPage" data-i18n-title="nav.nextPage"></button>
        </main>

        <button id="btn-menu" class="fab-menu" aria-label="القائمة" title="القائمة" data-icon="dots" data-i18n-aria-label="menu.title" data-i18n-title="menu.title">
            <span class="menu-dot" aria-hidden="true"></span>
        </button>

        <div id="overlay-backdrop" hidden></div>

        <!-- ---------- external-server consent dialog (sits above everything else) ---------- -->

        <div id="consent-backdrop" class="consent-backdrop" hidden></div>
        <section id="panel-consent" class="consent-dialog" hidden role="alertdialog" aria-labelledby="consent-title">
            <div class="panel-header">
                <h2 id="consent-title" data-i18n="consent.title">الاتصال بخادم خارجي</h2>
            </div>
            <div class="consent-body">
                <p id="consent-message"></p>
                <p id="consent-server-name" class="consent-server-name"></p>
                <p id="consent-url" class="consent-url" dir="ltr"></p>
            </div>
            <div class="consent-actions">
                <button id="consent-btn-no" class="btn-secondary" data-i18n="consent.no">لا</button>
                <button id="consent-btn-yes" class="btn-secondary" data-i18n="consent.yes">نعم</button>
                <button id="consent-btn-remember" class="btn-primary" data-i18n="consent.remember">نعم، وتذكر</button>
            </div>
        </section>

        <!-- ---------- main menu ---------- -->

        <section id="panel-menu" class="overlay-panel panel-menu" hidden>
            <div class="panel-header">
                <h2 data-i18n="menu.title">القائمة</h2>
                <button class="icon-btn" data-close aria-label="إغلاق" data-icon="close" data-i18n-aria-label="common.close"></button>
            </div>
            <ul class="menu-list">
                <li>
                    <button class="menu-item" data-target="panel-suras">
                        <span class="menu-item-icon" data-icon="menu-index"></span>
                        <span class="menu-item-label" data-i18n="menu.suras">الفهرس</span>
                    </button>
                </li>
                <li>
                    <button class="menu-item" data-target="panel-page">
                        <span class="menu-item-icon" data-icon="menu-page"></span>
                        <span class="menu-item-label" data-i18n="menu.page">الانتقال إلى صفحة</span>
                    </button>
                </li>
                <li>
                    <button class="menu-item" data-target="panel-search">
                        <span class="menu-item-icon" data-icon="menu-search"></span>
                        <span class="menu-item-label" data-i18n="menu.search">بحث</span>
                    </button>
                </li>
                <li class="menu-row menu-audio-row">
                    <button class="menu-item" data-target="panel-audio">
                        <span class="menu-item-icon" data-icon="menu-audio"></span>
                        <span class="menu-item-label" data-i18n="menu.audio">الاستماع</span>
                        <span id="menu-audio-dot" class="menu-item-audio-dot" aria-hidden="true"></span>
                    </button>
                    <button id="btn-menu-audio-stop" class="icon-btn menu-quick-btn" aria-label="إيقاف" title="إيقاف" disabled data-icon="stop-sm" data-i18n-aria-label="audio.stop" data-i18n-title="audio.stop"></button>
                    <button id="btn-menu-audio-playpause" class="icon-btn menu-quick-btn audio-playpause" aria-label="تشغيل" title="تشغيل" data-icon="play-pause-sm" data-i18n-aria-label="audio.action.play" data-i18n-title="audio.action.play"></button>
                </li>
                <li>
                    <button class="menu-item" data-target="panel-tafsir">
                        <span class="menu-item-icon" data-icon="menu-tafsir"></span>
                        <span class="menu-item-label" data-i18n="menu.tafsir">التفسير والترجمة</span>
                    </button>
                </li>
                <li>
                    <button class="menu-item" data-target="panel-settings">
                        <span class="menu-item-icon" data-icon="settings"></span>
                        <span class="menu-item-label" data-i18n="menu.settings">الإعدادات</span>
                    </button>
                </li>
            </ul>
        </section>

        <!-- ---------- sura index (custom, not a native select) ---------- -->

        <section id="panel-suras" class="overlay-panel" hidden>
            <div class="panel-header">
                <button class="icon-btn icon-back" data-back="panel-menu" aria-label="رجوع" title="رجوع" data-icon="chevron-back" data-i18n-aria-label="common.back" data-i18n-title="common.back"></button>
                <h2 data-i18n="menu.suras">الفهرس</h2>
                <button class="icon-btn" data-close aria-label="إغلاق" data-icon="close" data-i18n-aria-label="common.close"></button>
            </div>
            <div class="panel-subheader">
                <input id="sura-filter" type="search" placeholder="ابحث عن سورة…" autocomplete="off" data-i18n-placeholder="suras.filterPlaceholder">
            </div>
            <ul id="sura-list" class="sura-list" role="listbox" aria-label="السور" data-i18n-aria-label="suras.ariaLabel"></ul>
        </section>

        <!-- ---------- jump to page ---------- -->

        <section id="panel-page" class="overlay-panel panel-page" hidden>
            <div class="panel-header">
                <button class="icon-btn icon-back" data-back="panel-menu" aria-label="رجوع" title="رجوع" data-icon="chevron-back" data-i18n-aria-label="common.back" data-i18n-title="common.back"></button>
                <h2 data-i18n="menu.page">الانتقال إلى صفحة</h2>
                <button class="icon-btn" data-close aria-label="إغلاق" data-icon="close" data-i18n-aria-label="common.close"></button>
            </div>
            <div class="page-jump-body">
                <label class="setting-label" for="page-input" data-i18n="page.label">رقم الصفحة (١ - ٦٠٤)</label>
                <div class="page-jump-row">
                    <input id="page-input" type="number" min="1" max="604" inputmode="numeric" aria-label="اذهب إلى صفحة" data-i18n-aria-label="page.ariaLabel">
                    <button id="btn-page-go" class="btn-primary" data-i18n="page.go">اذهب</button>
                </div>
            </div>
        </section>

        <!-- ---------- search ---------- -->

        <section id="panel-search" class="overlay-panel" hidden>
            <div class="panel-header">
                <button class="icon-btn icon-back" data-back="panel-menu" aria-label="رجوع" title="رجوع" data-icon="chevron-back" data-i18n-aria-label="common.back" data-i18n-title="common.back"></button>
                <input id="search-input" type="search" placeholder="ابحث في القرآن…" autocomplete="off" data-i18n-placeholder="search.placeholder">
                <button class="icon-btn" data-close aria-label="إغلاق" data-icon="close" data-i18n-aria-label="common.close"></button>
            </div>
            <ul id="search-results" class="result-list"></ul>
        </section>

        <!-- ---------- settings ---------- -->

        <section id="panel-settings" class="overlay-panel" hidden>
            <div class="panel-header">
                <button class="icon-btn icon-back" data-back="panel-menu" aria-label="رجوع" title="رجوع" data-icon="chevron-back" data-i18n-aria-label="common.back" data-i18n-title="common.back"></button>
                <h2 data-i18n="menu.settings">الإعدادات</h2>
                <button class="icon-btn" data-close aria-label="إغلاق" data-icon="close" data-i18n-aria-label="common.close"></button>
            </div>

            <div class="setting-group">
                <span class="setting-label" data-i18n="settings.theme">المظهر</span>
                <div class="theme-swatches" role="radiogroup" aria-label="المظهر" data-i18n-aria-label="settings.theme">
                    <button class="swatch swatch-black"  data-theme="black"  aria-label="أسود" data-i18n-aria-label="theme.black"></button>
                    <button class="swatch swatch-white"  data-theme="white"  aria-label="أبيض" data-i18n-aria-label="theme.white"></button>
                    <button class="swatch swatch-yellow" data-theme="yellow" aria-label="أصفر" data-i18n-aria-label="theme.yellow"></button>
                </div>
            </div>

            <!-- <div class="setting-group">
                <label class="setting-label" for="font-select" data-i18n="settings.font">الخط</label>
                <select id="font-select">
                    <option value="me_quran">me_quran</option>
                    <option value="kufi">kufi</option>
                    <option value="uthman">uthman</option>
                    <option value="jalil">jalil</option>
                    <option value="amiri">amiri</option>
                </select>
            </div> -->

            <div class="setting-group">
                <label class="setting-label" for="language-select" data-i18n="settings.language">اللغة</label>
                <select id="language-select">
                    <option value="system" data-i18n="language.system">لغة النظام</option>
                    <option value="ar" data-i18n="language.ar">العربية</option>
                    <option value="en" data-i18n="language.en">English</option>
                </select>
            </div>

            <div class="setting-group">
                <label class="switch">
                    <input type="checkbox" id="simple-toggle">
                    <span class="switch-track"><span class="switch-thumb"></span></span>
                    <span class="switch-label" data-i18n="settings.hideDiacritics">إخفاء التشكيل</span>
                </label>
            </div>
        </section>

        <!-- ---------- audio ---------- -->

        <section id="panel-audio" class="overlay-panel" hidden>
            <div class="panel-header">
                <button class="icon-btn icon-back" data-back="panel-menu" aria-label="رجوع" title="رجوع" data-icon="chevron-back" data-i18n-aria-label="common.back" data-i18n-title="common.back"></button>
                <h2 data-i18n="menu.audio">الاستماع</h2>
                <button class="icon-btn" data-close aria-label="إغلاق" data-icon="close" data-i18n-aria-label="common.close"></button>
            </div>

            <div class="setting-group">
                <label class="setting-label" for="server-select" data-i18n="settings.server">الخادم</label>
                <select id="server-select"></select>
            </div>

            <div class="setting-group">
                <label class="setting-label" for="reader-select" data-i18n="audio.reader">القارئ</label>
                <select id="reader-select"></select>
            </div>

            <div class="setting-group">
                <label class="switch">
                    <input type="checkbox" id="autoadvance-toggle">
                    <span class="switch-track"><span class="switch-thumb"></span></span>
                    <span class="switch-label" data-i18n="audio.autoAdvance">الانتقال التلقائي للآية التالية</span>
                </label>
            </div>

            <p id="audio-now-playing" class="audio-now-playing" data-i18n="audio.nowPlaying.idle">لم يبدأ التشغيل</p>

            <div class="audio-controls">
                <button id="btn-audio-prev" class="icon-btn" aria-label="الآية السابقة" title="الآية السابقة" data-icon="audio-prev" data-i18n-aria-label="aya.prev" data-i18n-title="aya.prev"></button>
                <button id="btn-audio-playpause" class="icon-btn audio-playpause" aria-label="تشغيل" title="تشغيل" data-icon="play-pause-lg" data-i18n-aria-label="audio.action.play" data-i18n-title="audio.action.play"></button>
                <button id="btn-audio-stop" class="icon-btn" aria-label="إيقاف" title="إيقاف" disabled data-icon="stop" data-i18n-aria-label="audio.stop" data-i18n-title="audio.stop"></button>
                <button id="btn-audio-next" class="icon-btn" aria-label="الآية التالية" title="الآية التالية" data-icon="audio-next" data-i18n-aria-label="aya.next" data-i18n-title="aya.next"></button>
            </div>
        </section>

        <!-- ---------- tafsir / translation settings ---------- -->

        <section id="panel-tafsir" class="overlay-panel" hidden>
            <div class="panel-header">
                <button class="icon-btn icon-back" data-back="panel-menu" aria-label="رجوع" title="رجوع" data-icon="chevron-back" data-i18n-aria-label="common.back" data-i18n-title="common.back"></button>
                <h2 data-i18n="menu.tafsir">التفسير والترجمة</h2>
                <button class="icon-btn" data-close aria-label="إغلاق" data-icon="close" data-i18n-aria-label="common.close"></button>
            </div>

            <div class="setting-group">
                <label class="setting-label" for="tafsir-server-select" data-i18n="settings.server">الخادم</label>
                <select id="tafsir-server-select"></select>
            </div>

            <div class="tafsir-add-server-row">
                <button id="btn-tafsir-add-server" class="link-btn" type="button" data-icon="plus" data-i18n="tafsir.addServer"> إضافة خادم مخصص</button>
            </div>

            <div id="tafsir-add-server-form" class="tafsir-add-server-form" hidden>
                <label class="setting-label" for="tafsir-server-name" data-i18n="tafsir.serverNameLabel">اسم الخادم (اختياري)</label>
                <input id="tafsir-server-name" type="text" placeholder="مثال: خادمي الخاص" autocomplete="off" data-i18n-placeholder="tafsir.serverNamePlaceholder">
                <label class="setting-label" for="tafsir-server-url" data-i18n="tafsir.serverUrlLabel">رابط الخادم</label>
                <input id="tafsir-server-url" type="url" placeholder="https://example.com/tafsir" dir="ltr" autocomplete="off">
                <div class="tafsir-add-server-actions">
                    <button id="btn-tafsir-server-cancel" class="btn-secondary" type="button" data-i18n="common.cancel">إلغاء</button>
                    <button id="btn-tafsir-server-save" class="btn-primary" type="button" data-i18n="common.add">إضافة</button>
                </div>
            </div>

            <div class="setting-group" id="tafsir-remove-server-group" hidden>
                <span class="setting-label" data-i18n="tafsir.customServerNote">هذا خادم مخصص</span>
                <button id="btn-tafsir-remove-server" class="btn-danger" type="button" data-i18n="tafsir.removeServer">حذف الخادم</button>
            </div>

            <div class="setting-group">
                <span class="setting-label" data-i18n="tafsir.editionLabel">الإصدار (تفسير / ترجمة)</span>
                <button id="tafsir-edition-select" class="edition-field" type="button" aria-haspopup="true">
                    <span class="edition-field-label" data-i18n="tafsir.loading">جارٍ التحميل...</span>
                    <span class="edition-field-chevron" data-icon="chevron-down"></span>
                </button>
            </div>

            <p class="tafsir-hint" data-i18n="tafsir.hint">سيُطلب منك تأكيد الاتصال بالخادم قبل أول طلب لعرض التفسير.</p>
        </section>

        <!-- ---------- edition picker (categorized by language, shared by the settings panel and the aya panel) ---------- -->

        <section id="panel-edition-picker" class="overlay-panel" hidden>
            <div class="panel-header">
                <button class="icon-btn icon-back" id="btn-edition-picker-back" aria-label="رجوع" title="رجوع" data-icon="chevron-back" data-i18n-aria-label="common.back" data-i18n-title="common.back"></button>
                <h2 data-i18n="tafsir.chooseEdition">اختر إصدارًا</h2>
                <button class="icon-btn" data-close aria-label="إغلاق" data-icon="close" data-i18n-aria-label="common.close"></button>
            </div>
            <div class="panel-subheader">
                <input id="edition-filter" type="search" placeholder="ابحث عن تفسير أو لغة…" autocomplete="off" data-i18n-placeholder="tafsir.editionFilterPlaceholder">
            </div>
            <div id="edition-picker-list" class="edition-picker-list" role="listbox" aria-label="الإصدارات" data-i18n-aria-label="tafsir.editionsAriaLabel"></div>
        </section>

        <!-- ---------- aya detail (opened by tapping an aya on the page) ---------- -->

        <section id="panel-aya" class="overlay-panel" hidden>
            <div class="panel-header">
                <h2 id="aya-title" dir="rtl"></h2>
                <button id="btn-play-from-aya" class="icon-btn" aria-label="تشغيل من هنا" title="تشغيل من هنا" data-icon="play-sm" data-i18n-aria-label="aya.playFromHere" data-i18n-title="aya.playFromHere"></button>
                <button class="icon-btn" data-close aria-label="إغلاق" data-icon="close" data-i18n-aria-label="common.close"></button>
            </div>

            <div class="aya-edition-row">
                <button id="aya-tafsir-edition" class="edition-field" type="button" aria-haspopup="true">
                    <span class="edition-field-label" data-i18n="tafsir.ayaOnly">الآية فقط</span>
                    <span class="edition-field-chevron" data-icon="chevron-down"></span>
                </button>
                <button id="btn-tafsir-settings" class="icon-btn" aria-label="إعدادات التفسير" title="إعدادات التفسير" data-icon="settings-sm" data-i18n-aria-label="tafsir.settingsButton" data-i18n-title="tafsir.settingsButton"></button>
            </div>

            <div id="aya-content" class="aya-content">
                <p id="aya-text" class="aya-detail-text" dir="rtl"></p>
                <div id="aya-tafsir-section" class="tafsir-section" hidden>
                    <div class="tafsir-divider"></div>
                    <div id="tafsir-content" class="tafsir-content"></div>
                </div>
            </div>

            <div class="aya-nav">
                <button id="btn-aya-prev" class="icon-btn" aria-label="الآية السابقة" title="الآية السابقة" data-icon="audio-prev" data-i18n-aria-label="aya.prev" data-i18n-title="aya.prev"></button>
                <span id="aya-nav-label" class="aya-nav-label"></span>
                <button id="btn-aya-next" class="icon-btn" aria-label="الآية التالية" title="الآية التالية" data-icon="audio-next" data-i18n-aria-label="aya.next" data-i18n-title="aya.next"></button>
            </div>
        </section>
    </body>
</html>
